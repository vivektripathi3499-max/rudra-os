[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
pc-keyboard = { version = "0.7", default-features = false }
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
x86_64 = "0.14"
pic8259 = "0.10"
uart_16550 = "0.3"

[package.metadata.bootloader]
map-physical-memory = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
